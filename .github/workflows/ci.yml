# RawPage CI.
#
# THE ORDERING IS THE POINT. `gates` runs first, on a bare Linux runner with no Qt and no
# vcpkg, and everything else `needs:` it. A layering or licence violation therefore fails in
# well under a minute, before any runner has spent time installing a toolchain --
# Tech-Stack-Plan.md 9: "checks must pass before compilation".
#
# That is only possible because the gate executables link nothing but the C++ standard
# library (decision D0-1) and the root CMakeLists has a RAWPAGE_GATES_ONLY configuration that
# does not call find_package(Qt6). Measured locally: 3.8 s from configure to green.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =====================================================================================
  # 1. The gates. No Qt. No vcpkg. No layers. Fails first and fastest.
  # =====================================================================================
  gates:
    name: Gates (layer-lint, license-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: cmake --preset gates

      - name: Build the gate executables
        run: cmake --build --preset gates

      - name: Run the gates
        run: cmake --build --preset gates --target checks

      # The gates are also tested against deliberately bad input. A gate that has only ever
      # been run on a clean tree is an assumption, not a check.
      #
      # The gates.wrong_compiler.* cases are absent here by design: they configure against
      # cmake/toolchain-mingw.cmake, which pins a Windows compiler. tests/gates/CMakeLists.txt
      # guards them with if(WIN32), so this runner sees fewer cases than the Windows job does.
      #
      # The gates.headless_assert.* cases (Stage 2 T1) are NOT guarded and run here on purpose:
      # they are pure CMake over a LANGUAGES NONE fixture, and this Linux runner is the closest
      # thing the gate job has to the portable presets whose portability they defend.
      #
      # The gates.corpus.* cases (Stage 2 T4) run here for a stronger reason: this is the ONLY
      # place the cross-platform half of D2-11's claim gets checked. "Every file regenerates
      # byte-identically from a clean checkout" is a much weaker statement if only one machine
      # has ever regenerated them, and the two things most likely to break it are both
      # platform-shaped -- zlib's deflate output differs between builds, and math.cos is the
      # platform's libm. corpus/deflate.py and corpus/jpegenc.py exist precisely so this runner
      # agrees with the Windows one; if it ever does not, that divergence is the finding.
      #
      # This needs a Python 3.9+ interpreter, which the ubuntu-latest image ships. If one is
      # ever absent the three cases FAIL rather than vanishing (tests/gates/RequirePython.cmake)
      # -- Stage 1's I-30 was a job that reported green because it had never run.
      - name: Gate fixtures
        run: ctest --preset gates

      # Stage 3 P-2: which OpenSSL judges A4 on this runner. gates.validators.openssl above already
      # passed or failed on it; this step puts the path and version in the log, because a passing
      # ctest line does not show them and D3-2 requires every result to name its validator.
      - name: P-2 -- the A4 signature validator
        run: cmake -P tests/gates/ResolveOpenSSL.cmake

      # Stage 3 guide case A-15, surfaced. gates.corpus.signed passed or failed in "Gate fixtures";
      # a passing ctest line hides which validator judged the signed corpus and what each flipped-
      # byte control said -- and so does `ctest --verbose`, because RunGateCase.cmake prints a case's
      # output only on failure. Guide rule 3 is that a tick is not a clean run, so the same wrapper
      # runs here directly, where the log carries both.
      - name: A-15 -- the signed corpus, controls first
        run: cmake -P tests/gates/CheckSignatures.cmake

      # Guide case A-82, the half that can only be checked HERE. D1-4 says rawpage_ui_tests runs on
      # Windows and only on Windows, and the usual way that stops being true is not malice -- it is
      # somebody adding Qt Widgets to a Linux job to chase a coverage number, which quietly
      # redefines what this job and portable-asan prove. Asserted rather than trusted to the
      # if(WIN32) in the root CMakeLists, because that guard is one line and this is the property.
      - name: A-82 -- no widget or platform suite on Linux
        run: |
          leaked=$(ctest --preset gates -N | grep -cE '^ *Test +#[0-9]+: +(ui|platform|bench)\.' || true)
          if [ "$leaked" -ne 0 ]; then
            echo "::error::$leaked ui./platform./bench. case(s) registered on a Linux runner -- D1-4 is broken"
            exit 1
          fi
          echo "A-82: no ui., platform. or bench. cases on this runner, as D1-4 requires."

      - name: Upload THIRD-PARTY.md
        uses: actions/upload-artifact@v4
        with:
          name: third-party-notices
          path: THIRD-PARTY.md
          if-no-files-found: error

  # =====================================================================================
  # 2. The shipping build.
  # =====================================================================================
  # -------------------------------------------------------------------------------------
  # GITHUB-HOSTED since 2026-10-18. It was self-hosted for the two months before, and the
  # history is the reason for the shape of this job.
  #
  # 2026-08-18: the first CI run failed at "Install Qt". It was not a flake and not our
  # configuration:
  #
  #   * Qt 6.11.1 IS published, and tools_mingw1310 IS listed by aqt.
  #   * Both Updates.xml and its .sha256 return HTTP 200 from download.qt.io.
  #   * With hash checking disabled, aqt reveals the real error -- it requests
  #       .../qt6_6111/qt6_6111/Updates.xml   -> 404
  #     while Qt 6.11 splits its repository per architecture:
  #       .../qt6_6111/qt6_6111_mingw/Updates.xml   -> 200
  #   * aqtinstall 3.3.0 (latest) and 3.2.1 fail identically, and a trusted-mirror config
  #     does not help. The "checksum" error was masking the 404.
  #
  # Downgrading the Qt pin to something aqt could fetch was rejected -- TA-8 asserts 6.11.1, and
  # testing against a different Qt than we ship is precisely the ABI question risk A7 exists to
  # prevent -- so the job ran on the developer machine, whose Qt install IS the release build
  # environment. Stage0-Toolchain-Plan.md §9 had named that fallback.
  #
  # 2026-10-18: release 3.3.0 still fails the same way, but aqtinstall's main branch at commit
  # 076e165 installs 6.11.1. Measured against the developer machine's C:\Qt, file by file:
  #
  #   * 6.11.1/mingw_64: 10,790 of aqt's 10,947 files byte-identical; the 157 that differ are
  #     all .prl, .pc, qt.conf and qtenv2.bat -- the files aqt rewrites with its own install
  #     path. No binary differs.
  #   * Tools/mingw1310_64 (18,725 files), Tools/CMake_64 (3.30.5) and Tools/Ninja (1.12.1):
  #     identical, without exception.
  #   * The developer install also carries modules the build never links -- Charts (GPL-3.0,
  #     D4), Quick3D, Image Formats. They are NOT installed here on purpose: a product that came
  #     to depend on one fails in CI instead of only on the release machine.
  #
  # Why it moved: the repository is going public, and on a public repository a pull request
  # from a fork runs ITS OWN copy of this file -- so a self-hosted runner would execute a
  # stranger's code on the developer machine, under the developer's account. A hosted runner is
  # a fresh VM per job, which also makes every run a clean-machine build instead of one that
  # inherits the previous run's tree and vcpkg archives.
  #
  # "CI tests the bytes the release is built from" is no longer true by construction, so it is
  # ASSERTED: "Verify the toolchain is the pinned one" checks the SHA-256 of the five Qt DLLs
  # the build links (build/x64-release/qt-modules.txt) and of g++.exe against the developer
  # install's, and fails the job on a mismatch.
  #
  # aqtinstall is pinned to a COMMIT, never to the branch: an unreleased main branch moves.
  # Move to a release once one carries the per-architecture fix, and re-run the comparison.
  # The cache key names every pin, so changing one re-installs rather than reusing.
  # -------------------------------------------------------------------------------------
  windows:
    name: Windows x64 (Qt 6.11.1, MinGW 13.1.0)
    needs: gates
    runs-on: windows-2025
    timeout-minutes: 240
    # VCPKG_DEFAULT_BINARY_CACHE is named so the cache steps below can name the same directory.
    # RAWPAGE_OPENSSL, A4's validator, is set by the "Name the A4 signature validator" step.
    env:
      VCPKG_DEFAULT_BINARY_CACHE: C:\vcpkg-archives
    steps:
      - uses: actions/checkout@v4

      # Restore and save are separate steps, not one actions/cache, because a combined step
      # saves only when the whole job succeeds -- and a red test run would then re-download
      # 1.4 GB of Qt on every retry. The install is saved the moment it exists.
      - name: Restore the pinned Qt and its tools
        id: qt-cache
        uses: actions/cache/restore@v4
        with:
          path: C:\Qt
          key: qt-6.11.1-qtmultimedia-mingw1310-cmake3.30.5-ninja1.12.1-aqt076e165-v1

      - name: Install the pinned Qt and its tools
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          # Without this a failing native command does not stop the script, and only the LAST
          # aqt call's exit code would decide the step.
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install "aqtinstall @ git+https://github.com/miurahr/aqtinstall@076e1659807d0b362a3ed684d54c2e9c775eb9c7"
          python -m aqt install-qt  windows desktop 6.11.1 win64_mingw --outputdir C:\Qt -m qtmultimedia
          python -m aqt install-tool windows desktop tools_mingw1310 qt.tools.win64_mingw1310 --outputdir C:\Qt
          python -m aqt install-tool windows desktop tools_cmake qt.tools.cmake --outputdir C:\Qt
          python -m aqt install-tool windows desktop tools_ninja qt.tools.ninja --outputdir C:\Qt

      - name: Save the pinned Qt and its tools
        if: steps.qt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\Qt
          key: ${{ steps.qt-cache.outputs.cache-primary-key }}

      # The image ships vcpkg as VCPKG_INSTALLATION_ROOT. scripts/env.ps1 keeps a VCPKG_ROOT that is
      # already set, so this decides which vcpkg the build uses rather than relying on the image to
      # export both names (the Linux image does not -- see portable-asan). Which PORT versions
      # resolve is decided by vcpkg-configuration.json's git-registry baseline, not by this clone.
      - name: Point VCPKG_ROOT at the image's vcpkg
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe")) { throw "no vcpkg.exe under VCPKG_INSTALLATION_ROOT='$env:VCPKG_INSTALLATION_ROOT'" }
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

      - name: Restore vcpkg binaries
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: C:\vcpkg-archives
          key: vcpkg-mingw-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'tools/ports/**') }}
          restore-keys: vcpkg-mingw-

      # MUST come before the first vcpkg invocation, not merely before the compile step.
      # Measured at T6: vcpkg's x64-mingw-dynamic triplet runs a detect_compiler probe that
      # invokes the pinned g++, and without the toolchain bin on PATH, cc1plus cannot load
      # its own DLLs (0xC0000135). vcpkg reports that as "unable to detect the active
      # compiler's information", which reads exactly like a broken triplet or a missing port
      # and cost a false-negative A5 reading before the cause was found.
      # env.ps1's defaults are C:\Qt\..., which is exactly where the install step put everything.
      - name: Put the pinned toolchain on PATH
        shell: pwsh
        run: |
          . .\scripts\env.ps1
          echo "$env:PATH" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "RAWPAGE_MINGW_ROOT=$env:RAWPAGE_MINGW_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "RAWPAGE_QT_PREFIX=$env:RAWPAGE_QT_PREFIX"   | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "VCPKG_ROOT=$env:VCPKG_ROOT"             | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # The version check, and then the bytes. The hashes are the developer install's (C:\Qt on the
      # machine the release is built from, read 2026-10-18): this is what keeps "CI tests what we
      # ship" a checked claim now that CI downloads its own copy. A module added to the link closure
      # gets a row here in the same change.
      - name: Verify the toolchain is the pinned one
        shell: pwsh
        run: |
          g++ --version
          g++ -dumpmachine
          if ((g++ -dumpversion) -ne '13.1.0') { throw "expected GCC 13.1.0" }
          $pinned = [ordered]@{
            "$env:RAWPAGE_QT_PREFIX\bin\Qt6Core.dll"       = '10758b858b9985bfbfe70b7459bf5dbbdaf9874120e41c080c067d99e1cbd8e6'
            "$env:RAWPAGE_QT_PREFIX\bin\Qt6Gui.dll"        = '94e1a542e7c10d4c3b816ef43ccedd5b799fbdbec1a96cbc7a25dd8dcd1e6f9e'
            "$env:RAWPAGE_QT_PREFIX\bin\Qt6Widgets.dll"    = 'd345e3d7d693fa0150cb03a12112b6a3f27213bb59929bae2f5179b6fabf6d0b'
            "$env:RAWPAGE_QT_PREFIX\bin\Qt6Svg.dll"        = '89a32215a10c1c25fe7f0022ea77d6ab6128c8bfac0e30ab144f2e4312b860f6'
            "$env:RAWPAGE_QT_PREFIX\bin\Qt6Multimedia.dll" = 'd45968b53ea2b1776252427ba2424c1e5887644045af3679444946757eb06d97'
            "$env:RAWPAGE_MINGW_ROOT\bin\g++.exe"          = 'cd65c087ad69a877e5a105c607cc910abfabcc52ba7e9448572f36567b51698c'
          }
          foreach ($file in $pinned.Keys) {
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash.ToLowerInvariant()
            if ($actual -ne $pinned[$file]) { throw "$file is $actual, expected $($pinned[$file]) -- not the bytes the release is built from" }
            Write-Host "pinned  $file"
          }

      # A4's automated signature validator (Stage 3 P-2, decision D3-2), NAMED rather than found on
      # PATH. Measured 2026-09-14 on the then self-hosted runner: no OpenSSL was on the registry
      # PATH -- miniconda's arrived only through `conda init` in the user's PowerShell profile -- so
      # a job that found one was relying on a personal shell hook, and the job named Git for
      # Windows' C:\Program Files\Git\mingw64\bin\openssl.exe. The first hosted run (39141612907,
      # 2026-10-18) found no file there: the image's Git for Windows does not ship that copy.
      #
      # So the job names an ordered list of exact paths and takes the first that exists: the
      # image's own OpenSSL install, then Git for Windows' two locations. Still a choice written
      # here, never a PATH search -- every candidate's presence is printed, and the step fails if
      # none exists. tests/gates/ResolveOpenSSL.cmake explains why a set variable is then the only
      # place looked.
      - name: Name the A4 signature validator
        shell: pwsh
        run: |
          $candidates = @(
            'C:\Program Files\OpenSSL\bin\openssl.exe',
            'C:\Program Files\Git\usr\bin\openssl.exe',
            'C:\Program Files\Git\mingw64\bin\openssl.exe'
          )
          foreach ($c in $candidates) { Write-Host ("{0,-8} {1}" -f $(if (Test-Path -LiteralPath $c -PathType Leaf) { 'present' } else { 'absent' }), $c) }
          $chosen = $candidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $chosen) { throw "none of the named OpenSSL paths exists on this image -- A4's validator cannot run" }
          Write-Host "RAWPAGE_OPENSSL = $chosen"
          echo "RAWPAGE_OPENSSL=$chosen" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # Stage 3 P-2, the Windows half: the validator RAWPAGE_OPENSSL names, with its version. Before
      # Configure, so a missing one is reported before the build time is spent.
      - name: P-2 -- the A4 signature validator
        run: cmake -P tests/gates/ResolveOpenSSL.cmake

      # PDFium is NOT a vcpkg port -- there is no port -- and nothing under third_party/pdfium/
      # is committed except its README (.gitignore). So a fresh checkout has no engine, and
      # `cmake --preset x64-release` fails in rawpage_assert_pdfium() (PA-1) before anything is
      # compiled. That failure is the assertion doing its job; what was missing is this step.
      #
      # ADDED 2026-09-06, after the engine had been in the tree since T2 (2026-09-01) with no CI
      # run in between -- the Windows job had never once configured against Stage 2's code. The
      # script verifies the pinned SHA-256 and generates the GNU import library upstream does not
      # ship; it is idempotent, so on a machine that already has it, it is a no-op.
      - name: Fetch the pinned PDFium
        shell: pwsh
        run: .\scripts\fetch-pdfium.ps1

      # Configure is where vcpkg builds the manifest's ports, into VCPKG_DEFAULT_BINARY_CACHE.
      - name: Configure
        id: configure
        run: cmake --preset x64-release

      # Saved straight after Configure, even when Configure or a later step fails, for the reason
      # the Qt cache is -- but never when Configure did not run, which would save an empty
      # directory under the key. Only on a primary-key miss: a restore through restore-keys is a
      # miss, and saving then records the new manifest's archives under the new key.
      - name: Save vcpkg binaries
        if: ${{ !cancelled() && steps.configure.outcome != 'skipped' && steps.vcpkg-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: C:\vcpkg-archives
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      # Run the gates again here, against the REAL configuration. The Linux job cannot see
      # qt-modules.txt or compiler-plugins.txt -- both are written at configure time from
      # the actual Qt link closure and the actual compiler -- so the Qt Charts check and the
      # GCC-plugin check only have teeth in this job.
      - name: Gates against the real configuration
        run: cmake --build --preset x64-release --target checks

      - name: Build
        run: cmake --build --preset x64-release

      # Guide case A-82, the positive half. `ctest --preset x64-release` below runs everything
      # catch_discover_tests registered, so the widget suite needs no step of its own to RUN -- but
      # that also means it would vanish silently. A target that failed to build, or a discovery that
      # yielded nothing, subtracts cases from a run that still reports "100% tests passed", and the
      # number nobody was watching is the one that dropped. So the coverage claim is made
      # mechanically, before the run rather than after it.
      #
      # This is what Stage1-AppShell-Plan.md's T15 means by "tests/ui/ into the CI windows job".
      #
      # `render` JOINED THE LIST AT T18, and its absence is worth recording rather than quietly
      # fixing. `rawpage_render_tests` arrived at Stage 2 T2 and this loop was never told, so for
      # sixteen tasks the ONE suite that links the engine was the one suite whose disappearance CI
      # could not notice -- a build that dropped it would still have reported "100 % tests passed"
      # over 50 fewer cases, which is precisely the failure this loop exists to catch. Found at T16
      # by re-measuring a comment in `tests/render/CMakeLists.txt` that asserted the opposite.
      #
      # `render.golden.*` (T17) lives inside the `render.` prefix deliberately, so it is covered by
      # this line rather than needing a sixth entry somebody would have to remember.
      - name: A-82 -- the Windows-only suites are present
        shell: pwsh
        run: |
          $listed = ctest --preset x64-release -N
          foreach ($prefix in 'unit', 'ui', 'platform', 'render', 'bench') {
            $count = ($listed | Select-String -Pattern "^\s*Test\s+#\d+:\s+$prefix\." ).Count
            if ($count -eq 0) { throw "no '$prefix.' cases are registered -- the suite is missing, not passing" }
            Write-Host "$prefix. : $count case(s)"
          }

      - name: Test
        run: ctest --preset x64-release

      # Stage 3 guide case A-15 on this runner's validator (RAWPAGE_OPENSSL), surfaced for the reason
      # the gates job gives: the passing line above names neither the OpenSSL nor the controls.
      - name: A-15 -- the signed corpus, controls first
        run: cmake -P tests/gates/CheckSignatures.cmake

      # A-85 / R-9, the one A3 criterion that is a number rather than a judgement. It ran as part of
      # the suite above; this step surfaces the figure in the log, because a benchmark whose output
      # is buried in a passing ctest line is a benchmark nobody reads.
      - name: A-85 -- the R-9 tab-switch figure
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: .\build\x64-release\bin\rawpage_bench_ribbon.exe

      # A2's two figures, for the same reason: a number buried in a passing ctest line is a number
      # nobody reads, and D2-1's whole point is that the two must be read TOGETHER. The probe says
      # what PDFium costs; the product run says what the product costs, and they are different
      # quantities -- service time versus queued latency -- which each program's output states.
      - name: A2 -- the probe figure and the product figure
        shell: pwsh
        run: |
          .\build\x64-release\bin\rawpage_bench_render.exe
          .\build\x64-release\bin\rawpage_bench_pipeline.exe

      # The cheapest possible check that the CRT still matches Qt's (Tech-Stack-Plan.md 9).
      - name: Verify linkage
        shell: pwsh
        run: |
          $imports = objdump -p build/x64-release/bin/rawpage.exe | Select-String 'DLL Name'
          $imports
          if ($imports -match 'ucrtbase\.dll') { throw "rawpage.exe imports ucrtbase.dll -- the CRT no longer matches Qt's" }
          if ($imports -match 'Qt6Charts')     { throw "rawpage.exe imports Qt6Charts -- GPL-3.0-only module linked (D4)" }
          if (-not ($imports -match 'msvcrt\.dll')) { throw "rawpage.exe does not import msvcrt.dll" }

  # =====================================================================================
  # 3. The sanitizer gate MinGW GCC cannot give us on Windows (risk R7).
  #
  # This job is also the standing proof of the layer contract: core/, pdf/cos/ and pdf/ops/ must build
  # and pass with no display and no PDF engine. Here there is genuinely neither.
  # =====================================================================================
  portable-asan:
    name: Portable ASan + UBSan (Linux)
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools and QtCore
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build qt6-base-dev

      # ubuntu-latest ships vcpkg but exports it as VCPKG_INSTALLATION_ROOT, not VCPKG_ROOT
      # (windows-latest sets both, which is why this only failed on Linux). The preset reads
      # $env{VCPKG_ROOT}, so without this the toolchain path expanded to the bare
      # "/scripts/buildsystems/vcpkg.cmake" and configure failed on a file that never existed.
      - name: Export VCPKG_ROOT
        run: echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-linux-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: vcpkg-linux-

      - name: Configure
        run: cmake --preset portable-asan

      - name: Build core/, pdf/cos/ and pdf/ops/
        run: cmake --build --preset portable-asan

      # -fno-sanitize-recover=all is set in the preset, so any finding aborts rather than
      # printing and continuing. A sanitizer report that does not fail the build is a
      # sanitizer report nobody reads.
      # Guide cases A-82 and A-83, and this job is where both have teeth. A-83 -- rawpage_tests
      # links neither rawpage_ui nor rawpage_platform -- is enforced at CONFIGURE time by
      # rawpage_assert_headless() over the resolved link closure, so the configure step above having
      # succeeded is that assertion passing. What is checked here is the visible consequence: on a
      # machine with no Qt Widgets and no Win32 at all, no widget or platform case can exist.
      - name: A-82 / A-83 -- no widget or platform suite in the portable subset
        run: |
          leaked=$(ctest --preset portable-asan -N | grep -cE '^ *Test +#[0-9]+: +(ui|platform|bench)\.' || true)
          if [ "$leaked" -ne 0 ]; then
            echo "::error::$leaked ui./platform./bench. case(s) in the portable subset -- it is core/ + pdf/cos/ by rule"
            exit 1
          fi
          echo "A-82/A-83: the portable subset is core/ + pdf/cos/ + pdf/ops/, with no display and no engine."

      - name: Run the headless suite under ASan+UBSan
        run: ctest --preset portable-asan

      # Stage 6 guide case A-31 (plan Q8, D6-6): an INDEPENDENT reader of what our writer wrote. The
      # headless suite's tst_annotationops copies every file it saves into build/portable-asan/written;
      # qpdf --check reads each, after a truncated-stream control that must fail first. HERE and not in
      # the gates job the plan's P-4 named: that job builds no Qt and runs no suite, so it has no file to
      # judge -- and a qpdf step over no files is a green tick that checked nothing (the script refuses one).
      - name: A-31 -- qpdf judges every file the suite wrote
        run: |
          sudo apt-get install -y qpdf
          python3 tests/gates/check-qpdf.py --qpdf qpdf build/portable-asan/written/*.pdf

  # =====================================================================================
  # 4. libFuzzer over the COS reader (guide cases A-25 and A-26). Stage 2 T18.
  #
  # THESE TWO CASES HAVE BEEN "NOT RUN" SINCE T5 AND T6, and the reason was always the same and
  # always honest: MinGW GCC has no libFuzzer and there is no clang on the development machine, so
  # `portable-fuzz` could be configured and never linked. They were recorded as **Linux jobs** beside
  # A-04 rather than as pending boxes -- and then no Linux job existed to run them, which is the
  # difference between a deferral with an owner and a deferral without one. This job is the owner.
  #
  # TEN MINUTES IS THE GUIDE'S FIGURE, and it is not run here -- it is `fuzz-soak.yml`'s, a separate
  # workflow run daily and by hand (its header has the cadence's history). A fuzz target's value is in
  # long
  # soaks, and a ten-minute soak on every push would make the slowest job in the pipeline the one
  # that finds least. What this job establishes is the thing A-25's own "If it fails" clause calls
  # **S2**: *it builds*. A preset that has never built anything has not been proven to build
  # anything -- Stage 1's I-30 in a different costume, and the exact failure this project has already
  # had once. The short seeded run on top is a smoke test: it proves the driver starts, reads the
  # corpus, and executes the body, which is what turns "the target exists" into "the target runs".
  #
  # `tests/fuzz/CMakeLists.txt` fails configure on the wrong target count (A-27), so an empty fuzz
  # graph stops this job rather than passing it -- which is the half a "no crashes" check cannot
  # supply for itself.
  # =====================================================================================
  portable-fuzz:
    name: Portable libFuzzer (Linux, clang)
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools, clang and QtCore
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang qt6-base-dev

      - name: Export VCPKG_ROOT
        run: echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-linux-fuzz-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: vcpkg-linux-fuzz-

      # A-27 has teeth HERE: the target-count assertion is at configure time, so a fuzz graph that
      # had quietly become empty stops this step instead of producing two green "no crashes" runs
      # over nothing.
      - name: Configure
        run: cmake --preset portable-fuzz

      - name: Build the fuzz targets
        run: cmake --build --preset portable-fuzz

      # A-25's S2 half, made mechanical: the binaries exist and are executable. Checked before they
      # are run, because "it did not crash" is also what a missing file produces if nobody looks.
      # THREE from Stage 3 T13 (D3-17): fuzz_cos_roundtrip, the reader and the writer against each other.
      # FOUR from Stage 5 T4 (D5-21): fuzz_text_pipeline, core/text/ over hostile geometry.
      # FIVE from Stage 6 T2 (D6-29): fuzz_annot_pipeline, the annotation reader and store.
      - name: A-25 / A-26 / A-83 / S5 A-40 / S6 A-23 -- all five targets linked
        run: |
          for target in fuzz_cos_lexer fuzz_cos_parser fuzz_cos_roundtrip fuzz_text_pipeline fuzz_annot_pipeline; do
            path="build/portable-fuzz/bin/$target"
            if [ ! -x "$path" ]; then
              echo "::error::$path was not built -- a preset that has never linked anything has not been proven to link anything"
              exit 1
            fi
            echo "$target: linked"
          done

      # The smoke run, seeded from corpus/malformed/ -- a good seed set because every file in it is
      # a VALID document with one named fault, so the fuzzer starts from inputs that already reach
      # deep into the reader rather than from random bytes bouncing off the header check.
      #
      # 60 seconds each, not the guide's 600. The long soak is fuzz-soak.yml's work, and asking
      # for it on every push buys ten minutes of wall time per run to re-cover ground the previous
      # run already covered. `-error_exitcode=1` is explicit: libFuzzer's default already exits
      # non-zero on a crash, and saying so is cheaper than the day somebody wonders.
      #
      # A SANITIZER REPORT IS A CRASH HERE ONLY BECAUSE THE PRESET SAYS -fno-sanitize-recover=all.
      # Until 2026-09-14 `portable-fuzz` did not, so UBSan printed its finding and carried on, and
      # every run from T18 onward logged "signed integer overflow" at pdf/cos/Parser.cpp:586 under
      # a green tick -- Stage 2 issue I-38. `portable-asan` had the flag all along; the two presets
      # disagreed about what a finding is, and the one without it was the one looking hardest.
      - name: A-25 -- fuzz_cos_lexer, seeded
        run: ./build/portable-fuzz/bin/fuzz_cos_lexer corpus/malformed -max_total_time=60 -error_exitcode=1

      - name: A-26 -- fuzz_cos_parser, the primary target, seeded
        run: ./build/portable-fuzz/bin/fuzz_cos_parser corpus/malformed -max_total_time=60 -error_exitcode=1

      # Stage 3 T13, D3-17: "seeds gain the writer's own outputs". rawpage_fuzz_seeds runs the SAME body
      # the target does over the corpus and keeps every revision it composed -- files carrying an update
      # section written by this code, which no generator in corpus/ produces. It exits non-zero on a
      # finding or on zero seeds, so a broken seed step cannot hand the fuzzer an empty directory.
      - name: A-83 -- the writer's own outputs, as seeds
        run: ./build/portable-fuzz/bin/rawpage_fuzz_seeds fuzz-seeds/roundtrip corpus/ordinary corpus/signed corpus/malformed

      # The FIRST directory is where libFuzzer writes what it finds, so it is scratch; the checked-in
      # corpus is passed after it, read-only. The body's first local run found Stage 3 guide issue I-12 --
      # four ways an append changed what a repaired file's original bytes meant -- so a finding here is
      # the target doing its job, reproduced by adding the input to tests/roundtrip/tst_roundtrip.cpp.
      - name: A-83 -- fuzz_cos_roundtrip, seeded with the corpus and the writer's outputs
        run: |
          mkdir -p fuzz-work/roundtrip
          ./build/portable-fuzz/bin/fuzz_cos_roundtrip fuzz-work/roundtrip fuzz-seeds/roundtrip \
              corpus/malformed corpus/ordinary corpus/signed -max_total_time=60 -error_exitcode=1

      # Stage 5 T4, D5-21 (S5 guide A-40): the layout analyzer and the normalizer over synthetic
      # geometry -- NaN, the infinities, zero, negative and huge sizes. Seeded with corpus/labels/ as
      # plain bytes; the first directory is scratch, as above.
      - name: S5 A-40 -- fuzz_text_pipeline
        run: |
          mkdir -p fuzz-work/text
          ./build/portable-fuzz/bin/fuzz_text_pipeline fuzz-work/text corpus/labels \
              -max_total_time=60 -error_exitcode=1

      # Stage 6 T2, D6-29 (S6 guide A-23): bytes through the backend's first-party walk, the annotation
      # reader and the store -- threads, states, queries, the JSON round trip. Seeded with the corpus's
      # ordinary/ files, the annotation fixtures among them; the first directory is scratch, as above.
      - name: S6 A-23 -- fuzz_annot_pipeline
        run: |
          mkdir -p fuzz-work/annot
          ./build/portable-fuzz/bin/fuzz_annot_pipeline fuzz-work/annot corpus/ordinary corpus/malformed corpus/exchange \
              -max_total_time=60 -error_exitcode=1

  # =====================================================================================
  # 5. The coverage this run did NOT have.
  #
  # A skipped job is rendered as a grey tick beside green ones. Read quickly, a run with no
  # Windows coverage at all looks exactly like a run with full coverage.
  #
  # Stage1-AppShell-Testing-Guide.md's case A-80 says T15 must "either register the self-hosted
  # runner or record the deliberate absence rather than let a skipped job read as a passing one."
  # This job is that record, made by the machine on every run instead of by a sentence in a
  # document that ages. Until 2026-10-18 the `windows` job was gated on a repository variable
  # (RAWPAGE_HAS_WINDOWS_RUNNER) and this job read the VARIABLE -- so a run whose Windows job
  # failed or was cancelled still reported "ran". On the hosted runner there is no gate, and
  # this job reads the job's RESULT instead: anything but `success` is reported as no coverage.
  # It does not itself fail: a failed `windows` job already makes the run red, and a skipped or
  # cancelled one is what the warning below exists to make visible.
  # =====================================================================================
  coverage-report:
    name: Coverage actually obtained
    needs: [gates, windows, portable-asan, portable-fuzz]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Say what ran and what did not
        shell: bash
        run: |
          {
            echo "### Coverage obtained by this run"
            echo ""
            echo "| Job | State |"
            echo "|---|---|"
            echo "| \`gates\` | ${{ needs.gates.result }} |"
            echo "| \`portable-asan\` | ${{ needs['portable-asan'].result }} |"
            echo "| \`portable-fuzz\` | ${{ needs['portable-fuzz'].result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

          windows="${{ needs.windows.result }}"
          if [ "$windows" = "success" ]; then
            echo "| \`windows\` | success |" >> "$GITHUB_STEP_SUMMARY"
            echo "Windows coverage was obtained."
            exit 0
          fi

          {
            echo "| \`windows\` | **${windows} -- no coverage** |"
            echo ""
            echo "**The \`windows\` job's result is \`${windows}\`, so this run claims no Windows coverage.**"
            echo "Nothing below has been exercised to completion by this run:"
            echo ""
            echo "- \`ui.*\` — the widget suite (D1-4) AND \`ui.composition.*\`, the product's own composition (Stage 3 A-74)"
            echo "- \`platform.*\` — the Win32 layer"
            echo "- \`render.*\` — the engine suite AND \`render.golden.*\`, every golden baseline"
            echo "- \`bench.*\` — the A-85 / R-9 figure and BOTH A2 figures"
            echo "- \`platform.recovery.kill*\` — the kill harness (Stage 3 A-68, A-69): TerminateProcess during"
            echo "  commands and saves, which exists on Windows only and so is never in a Linux job"
            echo "- \`gates.wrong_compiler.*\` — the toolchain pin (Windows-only by design)"
            echo "- the real-configuration gate run, which is the only place \`qt-modules.txt\`"
            echo "  and \`compiler-plugins.txt\` exist, so the Qt Charts and GCC-plugin checks"
            echo "  have teeth nowhere else"
            echo "- the \`msvcrt.dll\` / \`ucrtbase.dll\` linkage check"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::warning title=No Windows coverage::The windows job's result is ${windows}. ui.*, platform.*, render.*, bench.* and the wrong-compiler fixtures did not complete on this run."
