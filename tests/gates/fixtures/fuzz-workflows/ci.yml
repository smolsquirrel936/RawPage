# Fixture: both targets linked and run -- the control.
jobs:
  portable-fuzz:
    steps:
      - name: linked
        run: |
          for target in fuzz_alpha fuzz_beta; do
            echo "$target"
          done
      - name: alpha
        run: ./build/portable-fuzz/bin/fuzz_alpha corpus/malformed -max_total_time=60
      - name: beta
        run: |
          ./build/portable-fuzz/bin/fuzz_beta fuzz-work/beta corpus/ordinary \
              -max_total_time=60
